name: Build Storm Data Prep Month

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Four-digit year, such as 2026'
        required: true
        default: '2026'
      month:
        description: 'Month number, 1-12'
        required: true
        default: '5'
      wfo:
        description: 'Three-letter WFO identifier, such as LIX'
        required: true
        default: 'LIX'

permissions:
  contents: write

jobs:
  build-stormprep-month:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests python-dateutil

      - name: Build Storm Data prep month
        env:
          BUILD_YEAR: ${{ github.event.inputs.year }}
          BUILD_MONTH: ${{ github.event.inputs.month }}
          BUILD_WFO: ${{ github.event.inputs.wfo }}
        run: |
          python scripts/build_month.py --year "$BUILD_YEAR" --month "$BUILD_MONTH" --wfo "$BUILD_WFO"

      - name: Commit generated Storm Data prep files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/stormprep docs/data/index.json
          if git diff --cached --quiet; then
            echo "No Storm Data prep file changes to commit."
          else
            git commit -m "Build Storm Data prep month"
            git push
          fi
