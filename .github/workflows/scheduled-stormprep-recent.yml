name: Scheduled Storm Data Prep Recent Months

on:
  workflow_dispatch:
    inputs:
      months_back:
        description: 'Number of months to build, including current UTC month'
        required: true
        default: '3'
      wfos:
        description: 'Comma-separated WFOs, or ALL'
        required: true
        default: 'ALL'
  schedule:
    - cron: '15 9 * * *'

permissions:
  contents: write

jobs:
  scheduled-stormprep-recent:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests python-dateutil

      - name: Build recent Storm Data prep months
        env:
          MONTHS_BACK: ${{ github.event.inputs.months_back || '3' }}
          BUILD_WFOS: ${{ github.event.inputs.wfos || 'ALL' }}
        run: |
          python scripts/build_recent_prep_months.py --months-back "$MONTHS_BACK" --wfos "$BUILD_WFOS"

      - name: Commit generated Storm Data prep files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/stormprep docs/data/index.json
          if git diff --cached --quiet; then
            echo "No Storm Data prep file changes to commit."
          else
            git commit -m "Scheduled Storm Data prep recent months"
            git push
          fi
