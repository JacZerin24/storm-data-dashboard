name: Build Storm Data Prep Month for All WFOs

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Four-digit year, such as 2026'
        required: true
        default: '2026'
      month:
        description: 'Month number, 1-12'
        required: true
        default: '5'
      wfos:
        description: 'Comma-separated WFOs, or ALL'
        required: true
        default: 'ALL'

permissions:
  contents: write

jobs:
  build-stormprep-all-wfos:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests python-dateutil

      - name: Build Storm Data prep month for selected WFOs
        env:
          BUILD_YEAR: ${{ github.event.inputs.year }}
          BUILD_MONTH: ${{ github.event.inputs.month }}
          BUILD_WFOS: ${{ github.event.inputs.wfos }}
        run: |
          python scripts/build_prep_month_all_wfos.py --year "$BUILD_YEAR" --month "$BUILD_MONTH" --wfos "$BUILD_WFOS"

      - name: Commit generated Storm Data prep files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/stormprep docs/data/index.json
          if git diff --cached --quiet; then
            echo "No Storm Data prep file changes to commit."
          else
            git commit -m "Build Storm Data prep month for WFOs"
            git push
          fi
