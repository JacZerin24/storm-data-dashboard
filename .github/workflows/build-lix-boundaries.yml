name: Build boundary GeoJSON

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-boundaries:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install geopandas shapely pyproj fiona

      - name: Build boundary GeoJSON
        run: |
          python scripts/build_boundaries.py

      - name: Commit generated boundary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/boundaries/*.geojson docs/data/boundaries/by_wfo/**/*.geojson
          if git diff --cached --quiet; then
            echo "No boundary file changes to commit."
          else
            git commit -m "Build boundary GeoJSON files"
            git push
          fi
